# KPI ledger — the evidence behind each mark.
#
# Seeded from the 2026 form as you submitted it. Section totals are carried under
# `declared_raw` because the form records totals, not itemised entries. As you add
# real entries under `entries`, they ADD to the declared figure, so zero out the
# declared value for a section once it is fully itemised.
#
# Every entry should carry `proof` — the form requires evidence for each claim.

